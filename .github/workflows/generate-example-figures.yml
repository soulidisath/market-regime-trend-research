name: Generate example figures

on:
  push:
    paths:
      - "examples/btc_usd_demo.py"
      - "src/market_regime.py"
      - ".github/workflows/generate-example-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install example dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas statsmodels arch matplotlib yfinance

      - name: Generate figures
        run: python examples/btc_usd_demo.py

      - name: Commit refreshed figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/output/*.png
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "Refresh reproducible example figures"
            git push
          fi
